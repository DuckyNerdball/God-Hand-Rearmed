[general]
# r601.rel (SNR2 DLL, "..\PS2_EE_Release\r601.elf") statically linked at 0x00799080 by
#   python -I tools/snr2/gen_modules.py r601   (= tools/snr2/snr2.py emit r601 --base 0x799080)
# and recompiled by 'python -I build.py modules r601' into build/snr2/gen/r601, then packed into
# generated_modules/r601/ (never generated/). Class 'room': slot heap 0x799000/0xF000 (cRelSys_loadSlot ReadAlloc, ra 0x2BE5A0, redirected from heap D 0x754220).
# The generated code is valid only at that base (literal PCs/return addresses), checked at link time by
# src/kamite/function_hooks.cpp (name + base + code sha256).
# Paths are relative to this file; build.py modules makes them absolute.
input = "../../build/snr2/out/r601/r601.elf"
output = "../../build/snr2/gen/r601"
single_file_output = false
output_worker_threads = 4
# 34 routine starts from snr2.py. Authoritative.
ghidra_output = "../../build/snr2/out/r601/r601_functions.csv"
ghidra_map_merge = true
patch_syscalls = false
patch_cop0 = false
patch_cache = false
auto_stub_by_name = false
direct_tail_calls = false
skip = []
stubs = []
# No runtime relocations: every import resolves to a boot .sndata export at static-link time
# (r601_runtime_relocations.csv has 0 rows).

# func_0079A890: looping SE 0x94 stops when f22 (-= 0.01 a poll) reaches 0. Step once a 30 FPS frame (census Nov 25).
[[patches.hooks]]
address = "0x0079AA28"
hook = "km_fps60_r601_se_timer"
flag = "fps60"
replace = true
