[general]
# r103.rel (SNR2 DLL, "..\PS2_EE_Release\r103.elf") statically linked at 0x00799080 by
#   python -I tools/snr2/gen_modules.py r103   (= tools/snr2/snr2.py emit r103 --base 0x799080)
# and recompiled by 'python -I build.py modules r103' into build/snr2/gen/r103, then packed into
# generated_modules/r103/ (never generated/). Class 'room': slot heap 0x799000/0xF000 (cRelSys_loadSlot ReadAlloc, ra 0x2BE5A0, redirected from heap D 0x754220).
# The generated code is valid only at that base (literal PCs/return addresses), checked at link time by
# src/kamite/function_hooks.cpp (name + base + code sha256).
# Paths are relative to this file; build.py modules makes them absolute.
input = "../../build/snr2/out/r103/r103.elf"
output = "../../build/snr2/gen/r103"
single_file_output = false
output_worker_threads = 4
# 15 routine starts from snr2.py. Authoritative.
ghidra_output = "../../build/snr2/out/r103/r103_functions.csv"
ghidra_map_merge = true
patch_syscalls = false
patch_cop0 = false
patch_cache = false
auto_stub_by_name = false
direct_tail_calls = false
skip = []
stubs = []
# No runtime relocations: every import resolves to a boot .sndata export at static-link time
# (r103_runtime_relocations.csv has 0 rows).

# The timed fight (func_007996F0): fp limits the first phase to 0x709 polls (60 s); s7 totals the polls of all three
# phases, tested against 0xB23 (95 s) with the game level after the fight. Count once a 30 FPS frame (census Nov 25).
[[patches.hooks]]
address = "0x00799888"
hook = "km_fps60_sleep_fp_up"
flag = "fps60"
replace = true

[[patches.hooks]]
address = "0x0079988C"
hook = "km_fps60_sleep_s7_up"
flag = "fps60"
replace = true

[[patches.hooks]]
address = "0x00799A08"
hook = "km_fps60_sleep_s7_up"
flag = "fps60"
replace = true

[[patches.hooks]]
address = "0x00799B34"
hook = "km_fps60_sleep_s7_up"
flag = "fps60"
replace = true
