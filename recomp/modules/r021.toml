[general]
# r021.rel (SNR2 DLL, "..\PS2_EE_Release\r021.elf") statically linked at 0x00799080 by
#   python -I tools/snr2/gen_modules.py r021   (= tools/snr2/snr2.py emit r021 --base 0x799080)
# and recompiled by 'python -I build.py modules r021' into build/snr2/gen/r021, then packed into
# generated_modules/r021/ (never generated/). Class 'room': slot heap 0x799000/0xF000 (cRelSys_loadSlot ReadAlloc, ra 0x2BE5A0, redirected from heap D 0x754220).
# The generated code is valid only at that base (literal PCs/return addresses), checked at link time by
# src/kamite/function_hooks.cpp (name + base + code sha256).
# Paths are relative to this file; build.py modules makes them absolute.
input = "../../build/snr2/out/r021/r021.elf"
output = "../../build/snr2/gen/r021"
single_file_output = false
output_worker_threads = 4
# 31 routine starts from snr2.py. Authoritative.
ghidra_output = "../../build/snr2/out/r021/r021_functions.csv"
ghidra_map_merge = true
patch_syscalls = false
patch_cop0 = false
patch_cache = false
auto_stub_by_name = false
direct_tail_calls = false
skip = []
stubs = []
# No runtime relocations: every import resolves to a boot .sndata export at static-link time
# (r021_runtime_relocations.csv has 0 rows).

# 60 FPS, the stage results screen (Nov 19; claude/framerate-sheet.md, "Menus in the room DLLs"). Each section
# (cR021::move_Gold / ClearTime / EM_LV / Result_Out / Continue / Dead_man / Get) slides its panel in from the right 80
# a frame to its place (clamped), rolls its numbers toward the totals, then waits for a press.
# The slides: 80 -> 40 a vblank (lui at,0x42A0 before each sub.s; the clamp ends them where they were).
[[patches.conditional]]
address = "0x00799A38"
value = "0x3C014220"
flag = "fps60"

[[patches.conditional]]
address = "0x00799C38"
value = "0x3C014220"
flag = "fps60"

