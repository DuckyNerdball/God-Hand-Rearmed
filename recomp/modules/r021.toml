# The rolls (+5 a frame per count, the gold roll CuntGold with its tick each call) run once per 30 FPS frame: the
# sections' sub-step loads (lh v1,2(sN) before the five-case switch) skip those sub-steps on second halves, unless a
# command is pressed (the press tests stay every vblank). Gold: 2 (the gold roll); ClearTime: 2 (the time); EM_LV: 2
# (kills), 3 (gold); Continue and Dead_man: 2 (the count), 3 (gold).
[[patches.hooks]]
address = "0x0079999C"
hook = "km_fps60_result_gate_s1_2"
flag = "fps60"
replace = true

