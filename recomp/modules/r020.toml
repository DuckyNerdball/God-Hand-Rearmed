[general]
# r020.rel (SNR2 DLL, "..\PS2_EE_Release\r020.elf") statically linked at 0x00799080 by
#   python -I tools/snr2/gen_modules.py r020   (= tools/snr2/snr2.py emit r020 --base 0x799080)
# and recompiled by 'python -I build.py modules r020' into build/snr2/gen/r020, then packed into
# generated_modules/r020/ (never generated/). Class 'room': slot heap 0x799000/0xF000 (cRelSys_loadSlot ReadAlloc, ra 0x2BE5A0, redirected from heap D 0x754220).
# The generated code is valid only at that base (literal PCs/return addresses), checked at link time by
# src/kamite/function_hooks.cpp (name + base + code sha256).
# Paths are relative to this file; build.py modules makes them absolute.
input = "../../build/snr2/out/r020/r020.elf"
output = "../../build/snr2/gen/r020"
single_file_output = false
output_worker_threads = 4
# 28 routine starts from snr2.py. Authoritative.
ghidra_output = "../../build/snr2/out/r020/r020_functions.csv"
ghidra_map_merge = true
patch_syscalls = false
patch_cop0 = false
patch_cache = false
auto_stub_by_name = false
direct_tail_calls = false
skip = []
stubs = []
# No runtime relocations: every import resolves to a boot .sndata export at static-link time
# (r020_runtime_relocations.csv has 0 rows).

# [Game] UnlockHard (KAMITE_UNLOCK_HARD): the difficulty select treats Hard as unlocked. The save's flag
# (0x747A28 bit 0x200000, set by a clear) is only read here, never written, so a save is not changed by it.
# Each 'and rX,rY,<0x200000>' on the flag becomes 'or rX,zero,<0x200000>':
#   0x79B25C  the menu's item animation (locked Hard does not grow)
#   0x79B374  the confirm (locked Hard buzzes)
#   0x79B924  the item sprites (Hard or the locked plate)
[[patches.conditional]]
address = "0x0079B25C"
value = "0x00061025"
flag = "unlock_hard"

[[patches.conditional]]
address = "0x0079B374"
value = "0x00031025"
flag = "unlock_hard"

[[patches.conditional]]
address = "0x0079B924"
value = "0x00041825"
flag = "unlock_hard"

# 0x799530: the room's init picks the three difficulty entries' message/sprite ids by the same flag (38, 39, 40 with
# Hard unlocked; 11, 12, 13 with it locked, the locked plate). Without this one the Hard sprite from 0x79B924 was
# drawn over the locked layout and the cursor could not reach it. and v0,v0,v1 -> or v0,zero,v1.
[[patches.conditional]]
address = "0x00799530"
value = "0x00031025"
flag = "unlock_hard"

# [Game] SkipIntro (KAMITE_SKIP_INTRO, src/kamite/game_options.cpp): boot straight to the main menu.
# The logos play only while 0x747A24 bit 0x800 ("logos shown") is clear: 'andi v0,v0,0x800' -> 'ori v0,zero,0x800'
#   0x7995A4  cR020::Initialize (logos, or the wait before the title)
#   0x799970  cR020::MoveWait (the same test once more)
[[patches.conditional]]
address = "0x007995A4"
value = "0x34020800"
flag = "skip_intro"

[[patches.conditional]]
address = "0x00799970"
value = "0x34020800"
flag = "skip_intro"

# titlePressWait: the Start/Circle press test 'and v0,v0,v1' (v1 = 0x8010 << 24) -> 'or v0,zero,v1': pressed at once.
[[patches.conditional]]
address = "0x0079A204"
value = "0x00031025"
flag = "skip_intro"

# 60 FPS family 1 (census Nov 2): cR020::MoveWait's 40-frame wait before the title (+8). The two other decrements in
# r020 (titleGameSel +0x14, titleLevelSel +0x1C) move the menu cursor on an Up press: not timers, left alone.
[[patches.hooks]]
address = "0x007999C4"
hook = "km_fps60_countdown_self"
flag = "fps60"
replace = true


# 60 FPS, the title's menus (Nov 19, K: "the title screen's effects run at double speed at 60"). cR020's moves step
# their glows, slides and waits once a frame with no rate (claude/framerate-sheet.md, families 1 and 3 "Menus in the
# room DLLs"). The cIDBase animations themselves already step every other frame (km_fps60_ui_anim).
# Glows: sine phases in degrees that TitleID (every frame) turns into the entries' alpha (+0x4F). Halved: the same pulse
# per second, still moving every vblank; the wraps (> 160 -> 20 / 15, > 180 -> 0) and clamps (15, 0, 180) end on the
# same values.
#   0x799ACC  TitleID +0x28 += 3.5   "Press Start"'s blink (flag 1)
#   0x799DA4  TitleID +0x2C += 2.0   entry 6's glow (not in the exit)
#   0x79A5D8  titleGameSel step 1: the hovered mode's glow +0x40 + 4i += 3.0
#   0x79A5FC  titleGameSel step 1: the other modes' +0x40 + 4i += 1.0 (to 15)
#   0x79ABE4  titleGameSel step 10: the modes' fade +-6.0 (to 180 / 0)
#   0x79B228  titleLevelSel step 1: the hovered difficulty's glow +0x30 + 4i += 3.5
#   0x79B218  titleLevelSel step 1: the other difficulties' += 1.0 (to 15)
# Waits counted in degrees (the end tests >= 180 / 40 / 70 land on the same step at half size):
#   0x79A400  titlePressWait step 4: "Press Start" slides up 20 a frame (entry 3 +0x3C) ...
#   0x79A408  ... while +0x28 += 15 runs 140 -> 180 (3 frames)
#   0x79BB78  titleExit step 1: +0x28 += 15 to 180 (the flash, 12 frames)
#   0x79BC4C  titleExit step 2: +0x28 += 0.5 to 40 (the fade starts) and 70 (the jump)
[[patches.conditional]]
address = "0x00799ACC"
value = "0x3C013FE0"
flag = "fps60"

[[patches.conditional]]
address = "0x00799DA4"
value = "0x3C013F80"
flag = "fps60"

[[patches.conditional]]
address = "0x0079A5D8"
value = "0x3C013FC0"
flag = "fps60"

[[patches.conditional]]
address = "0x0079A5FC"
value = "0x3C013F00"
flag = "fps60"

[[patches.conditional]]
address = "0x0079ABE4"
value = "0x3C014040"
flag = "fps60"

[[patches.conditional]]
address = "0x0079B228"
value = "0x3C013FE0"
flag = "fps60"

[[patches.conditional]]
address = "0x0079B218"
value = "0x3C013F00"
flag = "fps60"

[[patches.conditional]]
address = "0x0079A400"
value = "0x3C014120"
