# Pops ended by a threshold, then snapped (SetPos_ModeID / SetPos_LevelID put every item in place): the parity form, the
# full step on the tick and none on the second half, so they run through the PS2's values (a half step would end a
# vblank early and snap 20 px).
#   0x79A96C / 0x79B5E8  steps 2: the other items slide +-40 (+0x3C / +0x3C of the menu) ...
#   0x79A9C0 / 0x79B648  ... while the old item's scale +0x40 grows 0.15 a frame past 1.2
#   0x79AB18 / 0x79B7D8  steps 3: the new item's scale shrinks 0.15 a frame below 1.0
[[patches.hooks]]
address = "0x0079A96C"
hook = "km_fps60_float_add_f0f1"
flag = "fps60"
replace = true

[[patches.hooks]]
address = "0x0079A9C0"
hook = "km_fps60_float_add_f0f1"
flag = "fps60"
replace = true

[[patches.hooks]]
address = "0x0079AB18"
hook = "km_fps60_sub_parity_f0f0f1"
flag = "fps60"
replace = true

[[patches.hooks]]
address = "0x0079B5E8"
hook = "km_fps60_float_add_f0f1"
flag = "fps60"
replace = true

[[patches.hooks]]
address = "0x0079B648"
hook = "km_fps60_float_add_f0f1"
flag = "fps60"
replace = true

[[patches.hooks]]
address = "0x0079B7D8"
hook = "km_fps60_sub_parity_f0f0f1"
flag = "fps60"
replace = true

