[general]
# r206.rel (SNR2 DLL, "..\PS2_EE_Release\r206.elf") statically linked at 0x00799080 by
#   python -I tools/snr2/gen_modules.py r206   (= tools/snr2/snr2.py emit r206 --base 0x799080)
# and recompiled by 'python -I build.py modules r206' into build/snr2/gen/r206, then packed into
# generated_modules/r206/ (never generated/). Class 'room': slot heap 0x799000/0xF000 (cRelSys_loadSlot ReadAlloc, ra 0x2BE5A0, redirected from heap D 0x754220).
# The generated code is valid only at that base (literal PCs/return addresses), checked at link time by
# src/kamite/function_hooks.cpp (name + base + code sha256).
# Paths are relative to this file; build.py modules makes them absolute.
input = "../../build/snr2/out/r206/r206.elf"
output = "../../build/snr2/gen/r206"
single_file_output = false
output_worker_threads = 4
# 26 routine starts from snr2.py. Authoritative.
ghidra_output = "../../build/snr2/out/r206/r206_functions.csv"
ghidra_map_merge = true
patch_syscalls = false
patch_cop0 = false
patch_cache = false
auto_stub_by_name = false
direct_tail_calls = false
skip = []
stubs = []
# No runtime relocations: every import resolves to a boot .sndata export at static-link time
# (r206_runtime_relocations.csv has 0 rows).

# Nov 24 (K's case MADHOUSE: the building's enemies came every ~5 s at 60): the spawner task func_00799800 is a
# counted sleep(1) loop. Each poll, while GameWork +0x5EC bit 31 is set and fewer than 8 enemies live (func_0079A548),
# s0 counts down (the decrement sits in bgez's delay slot at 0x799860); below 0 it starts the spawn task (0x79A020, one
# enemy, at most 4 in the room's save) and reloads 0x168 (12 s at 30). The poll runs every vblank at 60, so the count
# ran twice as fast. Replaces slti v0,v0,8 (the live-enemy test): on second halves s0 + 1 first, which the delay
# slot's decrement takes back (frame_patches.cpp r206SpawnGate).
[[patches.hooks]]
address = "0x00799850"
hook = "km_fps60_r206_spawn_gate"
flag = "fps60"
replace = true
